services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: bolivia_experience_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bolivia_experience
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
