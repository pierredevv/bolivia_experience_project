name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: API TypeScript check
        run: npx tsc --noEmit
        working-directory: api

      - name: Install Web dependencies
        run: npm ci
        working-directory: web

      - name: Web TypeScript check
        run: npx tsc --noEmit
        working-directory: web

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: api

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: api

      - name: Setup SQLite
        run: node setup-db.js sqlite --seed
        working-directory: api

      - name: Run unit tests
        run: npm test
        working-directory: api

      - name: Run E2E tests
        run: npx jest --config jest-e2e.json --testTimeout=30000
        working-directory: api

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: web

      - name: Run tests
        run: npm test
        working-directory: web

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Build API
        run: npm run build
        working-directory: api

      - name: Install Web dependencies
        run: npm ci
        working-directory: web

      - name: Build Web
        run: npm run build
        working-directory: web

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Audit API dependencies
        run: npm audit --audit-level=high
        working-directory: api
        continue-on-error: true

      - name: Audit Web dependencies
        run: npm audit --audit-level=high
        working-directory: web
        continue-on-error: true
